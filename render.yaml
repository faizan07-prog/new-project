services:
  - type: web
    name: portfolio-website
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgresql
          property: connectionString
      - key: FRONTEND_URL
        value: https://portfolio-website.onrender.com

databases:
  - name: postgresql
    databaseName: portfolio_db
    user: portfolio_user
